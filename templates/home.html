{% extends "base.html" %}
{% block title %}Inicio | EcoEnergy{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <h1 class="display-5 fw-bold">EcoEnergy</h1>
  <p class="lead text-muted">Sistema de monitoreo de dispositivos y consumo energético.</p>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary">Ir al dashboard</a>
  {% else %}
    <a href="{% url 'login' %}" class="btn btn-primary">Iniciar sesión</a>
  {% endif %}
</div>
{% endblock %}
