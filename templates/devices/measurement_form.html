<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Medición - EcoEnergy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>
    <h2>Registrar Nueva Medición</h2>
    <form method="POST" class="card p-4 shadow mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar Medición</button>
    </form>
</body>
</html>
