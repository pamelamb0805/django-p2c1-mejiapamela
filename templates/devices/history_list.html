<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial - EcoEnergy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>
    <h2>Historial y Trazabilidad</h2>
    <ul class="list-group mt-3">
        {% for h in history %}
            <li class="list-group-item">Historial ID: {{ h.history_id }} - Motivo: {{ h.reason }}</li>
        {% empty %}
            <li class="list-group-item">No hay registros en el historial.</li>
        {% endfor %}
    </ul>
</body>
</html>
