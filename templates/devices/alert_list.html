<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alertas - EcoEnergy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>
    <h2>Eventos de Alerta</h2>
    <ul class="list-group mt-3">
        {% for alert in alerts %}
            <li class="list-group-item">Alerta en dispositivo: {{ alert.device.internal_name }} - Estado: {{ alert.status }}</li>
        {% empty %}
            <li class="list-group-item">No hay alertas registradas.</li>
        {% endfor %}
    </ul>
</body>
</html>
