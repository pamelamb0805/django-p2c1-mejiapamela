<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - EcoEnergy</title>
<!-- Carga de archivos estáticos en Django -->
{% load static %}
<link rel="stylesheet" href="{% static 'css/mystyle.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<style>
.tab-registro {
    max-width: 500px;
    margin: 30px auto;
    padding: 0 20px;
}
.error-msg { color: red; font-size: 0.85em; display: block; margin-bottom: 6px; }
</style>
</head>
<body>

  <!-- Barra de navegación con estilo EcoEnergy -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2 text-success fw-bold fs-4" href="{% url 'home' %}">
          ⚡ <span class="text-white">EcoEnergy</span>
        </a>
        <div class="d-flex gap-2">
          <a href="{% url 'accounts:registro' %}" class="btn btn-outline-light btn-sm">Registrarse</a>
          <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Iniciar Sesión</a>
        </div>
      </div>
    </nav>
  </header>

<div class="tab-registro">
  <!-- PROPIETARIO -->
  <div id="panelPropietario" class="tab-panel active">
    <form id="formPropietario" method="post" novalidate class="mt-4">
      {% csrf_token %}
      
      <h1>Registrarse</h1>
      <p class="text-muted">Rellene el formulario</p>
      <hr>

      <label for="rut_p"><b>Rut</b></label>
      <input type="text" placeholder="Ej: 12.345.678-9" name="rut" id="rut_p" maxlength="12" class="form-control mb-2">
      <span class="error-msg" id="err_rut_p"></span>

      <label for="nombre_p"><b>Nombre</b></label>
      <input type="text" placeholder="Ingrese su nombre" name="nombre" id="nombre_p" class="form-control mb-2">
      <span class="error-msg" id="err_nombre_p"></span>

      <label for="apellido_p"><b>Apellidos</b></label>
      <input type="text" placeholder="Ingrese sus Apellidos" name="apellido" id="apellido_p" class="form-control mb-2">
      <span class="error-msg" id="err_apellido_p"></span>

      <label for="fecha_p"><b>Fecha nacimiento</b></label>
      <input type="date" name="fecha_nacimiento" id="fecha_p" class="form-control mb-2">
      <span class="error-msg" id="err_fecha_p"></span>

      <label for="genero_p"><b>Sexo:</b></label>
      <select name="genero" id="genero_p" class="form-control mb-2">
        <option value="">-- Seleccione --</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
      </select>
      <span class="error-msg" id="err_genero_p"></span>

      <label for="telefono_p"><b>Teléfono</b></label>
      <input type="text" placeholder="+56912345678" name="telefono" id="telefono_p" class="form-control mb-2">
      <span class="error-msg" id="err_telefono_p"></span>

      <label for="email_p"><b>Email</b></label>
      <input type="email" placeholder="ejemplo@correo.com" name="email" id="email_p" class="form-control mb-2">
      <span class="error-msg" id="err_email_p"></span>

      <label for="pswd_p"><b>Contraseña</b></label>
      <input type="password" placeholder="Mínimo 8 caracteres" name="pswd" id="pswd_p" class="form-control mb-2">
      <span class="error-msg" id="err_pswd_p"></span>

      <label for="pswd2_p"><b>Repita su contraseña</b></label>
      <input type="password" placeholder="Repita su contraseña" name="pswd-repeat" id="pswd2_p" class="form-control mb-2">
      <span class="error-msg" id="err_pswd2_p"></span>

      <label class="mb-3">
        <input type="checkbox" name="Recordar"> Recuérdame
      </label>
      <p>
        <label>
          <input type="checkbox" name="terminos" id="terminos_p">
          Acepto los <a href="#" style="color:#0d6efd">Términos y condiciones</a>.
        </label>
        <span class="error-msg" id="err_terminos_p"></span>
      </p>

      <div class="d-flex gap-2 mt-3">
        <button type="button" class="btn btn-secondary w-50" onclick="window.location.href='{% url 'home' %}'">Cancelar</button>
        <input type="hidden" name="idperfil" value="2">
        <button type="submit" name="registrar_propietario" class="btn btn-primary w-50">Registrar</button>
      </div>

      <div class="text-center mt-3" style="font-size: 0.9rem;">
        ¿Ya tienes una cuenta? <a href="{% url 'login' %}" style="color: #0d6efd; text-decoration: none;">Inicia sesión aquí</a>
      </div>
    </form>
  </div>
</div>

<!-- Manejo de mensajes de éxito o error enviados desde la vista de Django -->
{% if messages %}
  {% for message in messages %}
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        Swal.fire({
          icon: '{{ message.tags }}' === 'error' ? 'error' : 'success',
          title: '{{ message.tags }}' === 'error' ? 'Error en el registro' : '¡Registro exitoso!',
          text: '{{ message }}',
          confirmButtonColor: '#0d6efd'
        }).then(() => {
          if ('{{ message.tags }}' !== 'error') {
            window.location.href = "{% url 'login' %}";
          }
        });
      });
    </script>
  {% endfor %}
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
/* ============================================================
   VALIDACIÓN DE RUT CHILENO (dígito verificador real)
   ============================================================ */
function limpiarRut(rut) {
    return rut.replace(/[^0-9kK]/g, '').toUpperCase();
}

function formatearRut(rut) {
    let limpio = limpiarRut(rut);
    if (limpio.length < 2) return rut;
    let cuerpo = limpio.slice(0, -1);
    let dv = limpio.slice(-1);
    cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return cuerpo + '-' + dv;
}

function validarRutChileno(rut) {
    let limpio = limpiarRut(rut);
    if (limpio.length < 2) return false;
    let cuerpo = limpio.slice(0, -1);
    let dv    = limpio.slice(-1);
    if (cuerpo.length < 7 || cuerpo.length > 8) return false;

    let suma = 0, multiplo = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo[i]) * multiplo;
        multiplo = multiplo === 7 ? 2 : multiplo + 1;
    }
    let dvEsperado = 11 - (suma % 11);
    if (dvEsperado === 11) dvEsperado = '0';
    else if (dvEsperado === 10) dvEsperado = 'K';
    else dvEsperado = String(dvEsperado);

    return dv === dvEsperado;
}

/* Autoformateo de RUT al escribir */
var campoRut = document.getElementById('rut_p');
if (campoRut) {
    campoRut.addEventListener('input', function() {
        this.value = formatearRut(this.value);
    });
}

/* ============================================================
   VALIDACIÓN GENERAL DE FORMULARIO
   ============================================================ */
function validarForm(sufijo) {
    var valido = true;

    function mostrarError(id, msg) {
        var el = document.getElementById('err_' + id + '_' + sufijo);
        if (el) { el.textContent = msg; }
        valido = false;
    }
    function limpiar(id) {
        var el = document.getElementById('err_' + id + '_' + sufijo);
        if (el) el.textContent = '';
    }

    ['rut','nombre','apellido','fecha','genero','telefono','email','pswd','pswd2','terminos'].forEach(limpiar);

    // RUT
    var rut = document.getElementById('rut_' + sufijo).value.trim();
    if (!rut) { mostrarError('rut', 'El RUT es obligatorio.'); }
    else if (!validarRutChileno(rut)) { mostrarError('rut', 'RUT inválido: dígito verificador incorrecto.'); }

    // Nombre
    var nombre = document.getElementById('nombre_' + sufijo).value.trim();
    if (!nombre) { mostrarError('nombre', 'El nombre es obligatorio.'); }
    else if (nombre.length < 2) { mostrarError('nombre', 'Mínimo 2 caracteres.'); }

    // Apellido
    var apellido = document.getElementById('apellido_' + sufijo).value.trim();
    if (!apellido) { mostrarError('apellido', 'El apellido es obligatorio.'); }
    else if (apellido.length < 2) { mostrarError('apellido', 'Mínimo 2 caracteres.'); }

    // Fecha + mayor de edad
    var fecha = document.getElementById('fecha_' + sufijo).value;
    if (!fecha) { mostrarError('fecha', 'La fecha de nacimiento es obligatoria.'); }
    else {
        var nac = new Date(fecha), hoy = new Date();
        var edad = hoy.getFullYear() - nac.getFullYear();
        var m = hoy.getMonth() - nac.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
        if (edad < 18) { mostrarError('fecha', 'Debe ser mayor de 18 años.'); }
    }

    // Género
    var genero = document.getElementById('genero_' + sufijo).value;
    if (!genero) { mostrarError('genero', 'Seleccione un sexo.'); }

    // Teléfono
    var tel = document.getElementById('telefono_' + sufijo).value.trim();
    if (!tel) { mostrarError('telefono', 'El teléfono es obligatorio.'); }
    else if (!/^\+569\d{8}$/.test(tel)) { mostrarError('telefono', 'Formato: +56912345678'); }

    // Email
    var email = document.getElementById('email_' + sufijo).value.trim();
    if (!email) { mostrarError('email', 'El correo es obligatorio.'); }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { mostrarError('email', 'Correo electrónico inválido.'); }

    // Contraseña
    var pswd  = document.getElementById('pswd_' + sufijo).value;
    var pswd2 = document.getElementById('pswd2_' + sufijo).value;
    if (!pswd) { mostrarError('pswd', 'La contraseña es obligatoria.'); }
    else if (pswd.length < 8) { mostrarError('pswd', 'Mínimo 8 caracteres.'); }
    if (!pswd2) { mostrarError('pswd2', 'Repita su contraseña.'); }
    else if (pswd !== pswd2) { mostrarError('pswd2', 'Las contraseñas no coinciden.'); }

    // Términos
    var terminos = document.getElementById('terminos_' + sufijo);
    if (!terminos.checked) { mostrarError('terminos', 'Debe aceptar los términos y condiciones.'); }

    return valido;
}

/* Interceptación del envío del formulario */
document.getElementById('formPropietario').addEventListener('submit', function(e) {
    if (!validarForm('p')) {
        e.preventDefault();
        Swal.fire({ icon: 'warning', title: 'Formulario incompleto', text: 'Por favor corrige los errores antes de continuar.', confirmButtonColor: '#0d6efd' });
    }
});
</script>
</body>
</html>
