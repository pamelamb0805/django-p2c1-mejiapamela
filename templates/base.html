{% load django_bootstrap5 %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}EcoEnergy{% endblock %}</title>

    <!-- Bootstrap 5 y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold text-success d-flex align-items-center gap-2 fs-4"
               href="{% url 'dispositivos:inicio' %}">

                <i class="bi bi-lightning-charge-fill"></i>
                EcoEnergy

            </a>


            <!-- Botón para celular -->
            <button class="navbar-toggler border-0"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto gap-2">

                    <!-- Zonas -->
                    <li class="nav-item">

                        <a class="nav-link active fw-bold"
                           href="{% url 'dispositivos:zonas' %}">

                            <i class="bi bi-geo-alt-fill me-1"></i>
                            Zonas

                        </a>

                    </li>


                    <!-- Dispositivos -->
                    <li class="nav-item">

                        <a class="nav-link active fw-bold"
                           href="{% url 'dispositivos:catalogo' %}">

                            <i class="bi bi-cpu-fill me-1"></i>
                            Dispositivos

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido dinámico -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
