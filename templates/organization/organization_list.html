<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Organizaciones - EcoEnergy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>
    <h2>Organizaciones Cliente</h2>
    <ul class="list-group mt-3">
        {% for org in organizations %}
            <li class="list-group-item">{{ org.legal_name }} - ID: {{ org.organization_id }}</li>
        {% empty %}
            <li class="list-group-item">No hay organizaciones registradas.</li>
        {% endfor %}
    </ul>
</body>
</html>
